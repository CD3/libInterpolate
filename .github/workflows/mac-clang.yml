name: mac-clang

on:
  push:
    branches:
      - master
    paths-ignore:
        - 'doc/**'
        - '**/*.md'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'

jobs:
  build:
    name: ci-macos-15-apple-clang
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # the version number is detected from git tags
          fetch-depth: 0

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Configure python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/requirements.txt

      - name: Install Python dependencies
        run: pip install -r .github/requirements.txt

      - name: Configure Conan profile
        run: conan profile detect --force --name default

      - name: Install Conan dependencies
        run: conan install conanfile.txt -r conancenter -s compiler.cppstd=17 --build=missing

      - name: Configure CMake
        run: cmake --preset conan-release -DCMAKE_INSTALL_PREFIX=install -DTEST_WITH_WERROR:BOOL=OFF

      - name: Build
        run: cmake --build --preset conan-release

      - name: Test
        run: ctest --preset conan-release --output-on-failure

      - name: Install
        run: cmake --build --preset conan-release --target install
